<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <title> List of Sign Ups </title>
    </head>

<body>

<h1> List of Students Who Signed-up </h1>

<a href = "index.html" class = "back-link"> Back to Sign ups </a> <br></br>

<div class="controls">
        <label for="clubFilter">Select Your Club</label>
        <select id="clubFilter" onchange="filterSignups()">
            <option value="" disabled selected>Select an option</option>
            <option value="alianti">Alianti [Frisbee]</option>
            <option value="bakeclub">Bake Club [Baking]</option>
            <option value="himigagham">Himig Agham [Choral]</option>
            <option value="kamalayan">Kamalayan [Filipino Theater]</option>
            <option value="kislap">Kislap [Volleyball]</option>
            <option value="exposure">Exposure [Photography]</option>
            <option value="ellipsis">Ellipsis [Literature]</option>
            <option value="astrosoc">AstroSoc [Astronomy]</option>
        </select>
</div>

<div class = "message" id = "totalSignUps"></div>

<table id = "signupsTable">
    <thead>
        <tr>
            <th> Club </th>
            <th> Student ID </th>
            <th> Full Name </th>
            <th> Grade </th>
            <th> Email </th>
            <th> Mobile </th>
        </tr>
    </thead>
    <tbody></tbody>

</table>

</body>

<script>
let signUps = JSON.parse(localStorage.getItem("clubSignUps")) || [];

const tableBody = document.querySelector("#signupsTable tbody");
const total = document.getElementById("totalSignups");
const clubFilter = document.getElementById("clubFilter");

function fixTable(filter) {
    tableBody.innerHTML = "";

    if(signUps.length === 0) {
        total.textContent = "";
        tableBody.innerHTML = '<tr><td colspan="9">No sign-ups saved yet.</td></tr>';
        return;
    }

    let filed = signUps;
    if(filter && filter !== "all") {
        filed = signUps.filter(s => s.club === filter);
    }

    if(filed.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="9">No sign-ups for this club.</td></tr>';
    } else {
        filed.forEach(s => {
            const row = `<tr>
                <td>${s.studentId}</td>
                <td>${s.fullName}</td>
                <td>${s.grade}</td>
                <td>${s.email}</td>
                <td>${s.mobile}</td>

>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    total.textContent = `Total Sign-ups: ${filed.length}`;
}


fixTable("all");

clubFilter.addEventListener("change", () => {
    fixTable(clubFilter.value);
});

</script>
